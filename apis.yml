aid: exein
name: exein
description: >-
  Exein is a Physical AI and embedded/IoT cybersecurity company (Italy) that secures connected
  devices, firmware, and Linux/RTOS embedded systems. Its platform pairs on-device runtime
  threat detection (Exein Runtime) with AI-powered firmware analysis and SBOM ingestion (Exein
  Analyzer), mapping findings to standards including the EU Cyber Resilience Act, ETSI EN 303-645,
  IEC 62443, RED 3.3, and the US Cyber Trust Mark. Exein does not publish a hosted public REST
  API; its developer surface is open-source security tooling in the exein-io GitHub organization —
  notably Pulsar (an eBPF-powered runtime security agent) and Kepler (a NIST-based CVE lookup
  store and API). Surfaced as a portfolio company of balderton-capital, hv-capital, and partech.
